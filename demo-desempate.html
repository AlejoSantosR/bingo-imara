<!doctype html>
<html lang="es" data-imara-tie-demo>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Demo tragamonedas · Bingo IMARA</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0d0b0a;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center}
    .demo-start{position:fixed;z-index:2147483600;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:18px 26px;font:900 16px system-ui;background:linear-gradient(135deg,#ffcf58,#8d6bff);color:#17110a;box-shadow:0 18px 55px #0009;cursor:pointer}
    .demo-note{position:fixed;z-index:2147483599;left:50%;top:calc(50% + 52px);transform:translateX(-50%);color:#e8d9c1;font:700 12px system-ui;text-align:center;width:min(90vw,620px)}
  </style>
</head>
<body>
  <button class="demo-start" id="demoStart" type="button">🎰 Ver demo grande con sonido</button>
  <div class="demo-note" id="demoNote">Simulación aislada · no modifica rondas, cartones ni ganadores reales.</div>

  <script src="bingo-round-upgrades-2026.js?v=20260919-TIE-SLOT-LARGE-1"></script>
  <script>
  (function(){
    const candidates=[
      {card_id:'IMARA-014',buyer_alias:'Laura'},
      {card_id:'IMARA-057',buyer_alias:'Camila'},
      {card_id:'IMARA-083',buyer_alias:'Juan'},
      {card_id:'IMARA-101',buyer_alias:'Alejo'}
    ];
    let timers=[];
    const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
    function emit(show,roundStatus='open'){
      window.dispatchEvent(new CustomEvent('imara-public-game-state',{detail:{
        game:{
          drawn:[4,8,12,16,20,23,29,33,36,39],
          round:{name:'Ronda Demo',pattern:'line',prize:'Premio sorpresa IMARA',status:roundStatus},
          show_state:show,
          updated_at:new Date().toISOString()
        }
      }}));
    }
    function cycle(){
      timers.forEach(clearTimeout);timers=[];
      const started=new Date().toISOString();
      emit({type:'tie',started_at:started,duration_ms:10000,round_name:'Ronda Demo',candidates});
      later(()=>emit({
        type:'winner',
        at:new Date().toISOString(),
        round_name:'Ronda Demo',
        winner:{card_id:'IMARA-057',buyer_alias:'Camila',position:1,prize:'Premio sorpresa IMARA',round_name:'Ronda Demo'}
      },'closed'),10400);
      later(()=>emit({type:'idle'},'closed'),18000);
      later(cycle,20000);
    }
    document.getElementById('demoStart').addEventListener('click',()=>{
      document.getElementById('demoStart').remove();
      document.getElementById('demoNote')?.remove();
      cycle();
    });
    window.addEventListener('pagehide',()=>timers.forEach(clearTimeout));
  })();
  </script>
</body>
</html>
