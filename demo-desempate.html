<!doctype html>
<html lang="es" data-imara-tie-demo>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Demo desempate · Bingo IMARA</title>
  <link rel="stylesheet" href="mobile-card-responsive-2026.css?v=20260919-CARD-SCREEN-1">
  <script>
  (function(){
    const sample={
      v:1,id:'IMARA-DEMO',buyer:'Participante Demo',status:'Pagado',ballMax:99,
      title:'BINGO IMARA',organizer:'PL4 Tribu IMARA',
      grid:[
        [4,23,43,64,84],
        [8,29,48,70,90],
        [12,33,'FREE',73,94],
        [16,36,53,77,97],
        [20,39,58,80,99]
      ]
    };
    const bytes=new TextEncoder().encode(JSON.stringify(sample));let bin='';
    bytes.forEach(b=>bin+=String.fromCharCode(b));
    const code=btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    history.replaceState(null,'',location.pathname+'#mobile='+code);
    window.escapeHtml=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  })();
  </script>
</head>
<body>
  <script src="mobile-card.js?v=20260902-SECURE-3"></script>
  <script src="mobile-tie-sync-2026.js?v=20260919-TIE-SYNC-1"></script>
  <script>
  (function(){
    const candidates=[
      {card_id:'IMARA-014',buyer_alias:'Laura'},
      {card_id:'IMARA-057',buyer_alias:'Camila'},
      {card_id:'IMARA-083',buyer_alias:'Juan'},
      {card_id:'IMARA-101',buyer_alias:'Alejo'}
    ];
    let timers=[];
    const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
    function emit(show,roundStatus='open'){
      window.dispatchEvent(new CustomEvent('imara-mobile-game-state',{detail:{
        game:{
          drawn:[4,8,12,16,20,23,29,33,36,39],
          round:{name:'Ronda Demo',pattern:'line',prize:'Premio sorpresa IMARA',status:roundStatus},
          show_state:show,
          updated_at:new Date().toISOString()
        }
      }}));
    }
    function cycle(){
      timers.forEach(clearTimeout);timers=[];
      const started=new Date().toISOString();
      emit({type:'tie',started_at:started,duration_ms:10000,round_name:'Ronda Demo',candidates});
      later(()=>emit({
        type:'winner',
        at:new Date().toISOString(),
        round_name:'Ronda Demo',
        winner:{card_id:'IMARA-057',buyer_alias:'Camila',position:1,prize:'Premio sorpresa IMARA',round_name:'Ronda Demo'}
      },'closed'),10400);
      later(()=>emit({type:'idle'},'closed'),14800);
      later(cycle,16400);
    }
    later(cycle,700);
    window.addEventListener('pagehide',()=>timers.forEach(clearTimeout));
  })();
  </script>
</body>
</html>
